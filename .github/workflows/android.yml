name: Build and Release Windora APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK with Gradle
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Windora-Messenger.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          ls -lh Windora-Messenger.apk app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windora-apk
          path: Windora-Messenger.apk

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push origin latest --force

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="Windora Messenger (Latest Build)"
          BODY="### 🚀 آخرین نسخه اندروید ویندورا مسنجر (Windora Messenger)

          - **تگ:** \`latest\`
          - **شناسه کامیت:** \`${{ github.sha }}\`
          - **شاخه:** \`${{ github.ref_name }}\`
          - **تاریخ ساخت:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ---
          #### 📥 لینک‌های مستقیم دانلود فایل نصبی:
          - 📲 **[دانلود Windora-Messenger.apk (پیشنهادی)](https://github.com/${{ github.repository }}/releases/download/latest/Windora-Messenger.apk)**
          - 📦 **[دانلود app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)**"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists. Updating assets and notes..."
            gh release upload "$TAG" Windora-Messenger.apk app-debug.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY" --latest
          else
            echo "Creating new release for tag '$TAG'..."
            gh release create "$TAG" Windora-Messenger.apk app-debug.apk \
              --title "$TITLE" \
              --notes "$BODY" \
              --latest
          fi
          echo "Successfully released APK under tag '$TAG'!"
